# Fry High — Pommespilot Game Worker
# Deploy: cd infrastructure/cloudflare && npx wrangler deploy --config wrangler-game.toml
#
# Erst-Setup (leere DB): siehe Kopf von game-schema.sql.
# Bestehende DB (Mai-Stand): VOR dem Deploy den Block "Migration 2026-09-11" aus game-schema.sql
#   per `wrangler d1 execute fryhigh-game --remote --command "…"` ausführen (Worker liest neue Spalten).
# Secrets (je: npx wrangler secret put NAME --config wrangler-game.toml):
#   RESEND_API_KEY      — Pflicht für Bestätigungs-, Gewinner- und Crew-Mail (Resend-Domain fryhigh.de muss verifiziert sein)
#   CREW_PIN            — Pflicht für /vouchers/check-Details, /vouchers/redeem, /admin/*
#   MAILERLITE_API_KEY  — optional, nur wenn MAILERLITE_GROUP_ID gesetzt ist

name = "fryhigh-game"
main = "game-worker.js"
compatibility_date = "2026-05-17"

# Cron Sonntag 23:00 UTC = Montag 01:00 MESZ / 00:00 MEZ.
# Wochenschlüssel (Mo 00:00 – So 23:59) rechnet der Worker über Europe/Berlin, in submit und cron identisch.
[triggers]
crons = ["0 23 * * SUN"]

[vars]
FROM_EMAIL           = "spiel@fryhigh.de"      # in Resend unter der verifizierten Domain fryhigh.de
TO_EMAIL_OPS         = "info@fryhigh.de"       # Crew-Mail bei Gewinner-Ausgabe
ALLOW_ORIGIN         = "https://fryhigh.de,https://www.fryhigh.de,https://fryhigh.pages.dev"   # Liste; Origin-Echo nur bei Treffer (Pages-Projekt 'fryhigh', Konto joschkatraue, 11.09.)
VERIFY_BASE          = "https://fryhigh-game.fryhigh-bhv.workers.dev"   # Magic-Link zeigt auf den Worker (Route /verify); Subdomain fryhigh-bhv im Konto joschkatraue (11.09.)
SITE_BASE            = "https://fryhigh.de"    # Rücksprung nach /spiel und Link auf /spiel/teilnahmebedingungen
VOUCHER_KIND         = "eur"                   # F29 Joschka 11.09.: Gutschein über 15 € ('meal' = Gericht nach Wahl bleibt als Option)
VOUCHER_LABEL        = "15-€-Gutschein für Fry High"
VOUCHER_VALUE_EUR    = "15"                    # Gutscheinwert (F29)
VOUCHER_VALID_DAYS   = "30"
REDEEM_LOCATION      = "Fry High im Zoo am Meer oder am Foodtruck"   # F31 Joschka 11.09.
SCORE_HARD_CAP       = "20000"
MIN_DURATION_MS      = "5000"
SCORE_PER_SECOND_MAX = "40"                    # Sammelflug: 10 Punkte je Zutat + 50 Bonus; Plausibilitätsgrenze
TERMS_VERSION        = "2026-09-11"            # Fallback, falls der Client keine terms_version schickt
MAILERLITE_GROUP_ID  = ""                      # leer = Newsletter-Opt-in wird nur in D1 vermerkt (Crew trägt von Hand ein)

# D1-Database — fryhigh-game
[[d1_databases]]
binding       = "DB"
database_name = "fryhigh-game"
database_id   = "3e0e2dda-2ba0-4bde-9019-ab1edc7eb567"   # neu angelegt 11.09.2026 im Konto joschkatraue (alte ID 133c9e39… lag im unbekannten Konto)
